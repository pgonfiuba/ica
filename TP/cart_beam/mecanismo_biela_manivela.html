<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mecanismo biela-manivela</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 30px auto; }
  label { font-size: 14px; color: #555; }
  input[type=number] { width: 100%; box-sizing: border-box; padding: 4px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 1rem; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  input[type=range] { flex: 1; }
  svg { width: 100%; height: auto; background: #f5f5f5; border-radius: 8px; }
</style>
</head>
<body>
<h2>Mecanismo biela-manivela</h2>

<div class="grid">
  <div><label>r1 (manivela)</label><input type="number" id="r1" value="53" step="1"></div>
  <div><label>r2 (barra)</label><input type="number" id="r2" value="104" step="1"></div>
  <div><label>l (biela)</label><input type="number" id="l" value="33" step="1"></div>
  <div><label>x1</label><input type="number" id="x1" value="77" step="1"></div>
  <div><label>y1</label><input type="number" id="y1" value="49" step="1"></div>
</div>

<div class="row">
  <label>φ (servo)</label>
  <input type="range" min="0" max="360" step="1" value="45" id="phi">
  <span id="phi-out" style="min-width:60px; text-align:right;">45°</span>
</div>

<div class="row">
  <span>θ (barra): <b id="theta-out">-</b></span>
  <label style="margin-left:auto;"><input type="checkbox" id="rama"> rama alternativa</label>
</div>

<svg id="svg" viewBox="0 0 600 500"></svg>

<script>
const svg = document.getElementById('svg');
const phiInput = document.getElementById('phi');
const phiOut = document.getElementById('phi-out');
const thetaOut = document.getElementById('theta-out');
const ramaInput = document.getElementById('rama');
const ids = ['r1','r2','l','x1','y1'];
const inputs = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

const scale = 3;
const cx = 80, cy = 150;

function toScreen(x, y) {
  return [cx + x*scale, cy - y*scale];
}

function anguloBarra(phi, r1, r2, l, x1, y1, rama) {
  const p2x = x1 + r1*Math.cos(phi);
  const p2y = -y1 + r1*Math.sin(phi);
  const D = Math.hypot(p2x, p2y);
  const cosArg = (r2*r2 + D*D - l*l) / (2*r2*D);
  if (Math.abs(cosArg) > 1) return null;
  const alpha = Math.atan2(p2y, p2x);
  const beta = Math.acos(Math.max(-1, Math.min(1, cosArg)));
  return alpha + (rama ? -1 : 1)*beta;
}

function draw() {
  const r1 = parseFloat(inputs.r1.value);
  const r2 = parseFloat(inputs.r2.value);
  const l = parseFloat(inputs.l.value);
  const x1 = parseFloat(inputs.x1.value);
  const y1 = parseFloat(inputs.y1.value);
  const phiDeg = parseFloat(phiInput.value);
  const phi = phiDeg * Math.PI / 180;
  const rama = ramaInput.checked;

  phiOut.textContent = phiDeg + '°';

  const O1 = [0, 0];
  const O2 = [x1, -y1];
  const P2 = [O2[0] + r1*Math.cos(phi), O2[1] + r1*Math.sin(phi)];
  const theta = anguloBarra(phi, r1, r2, l, x1, y1, rama);

  let elems = '';
  const [o1x, o1y] = toScreen(...O1);
  const [o2x, o2y] = toScreen(...O2);
  const [p2x, p2y] = toScreen(...P2);

  elems += `<line x1="${o2x}" y1="${o2y}" x2="${p2x}" y2="${p2y}" stroke="#D85A30" stroke-width="4" stroke-linecap="round"/>`;

  if (theta === null) {
    thetaOut.textContent = 'fuera de rango';
  } else {
    const P1 = [O1[0] + r2*Math.cos(theta), O1[1] + r2*Math.sin(theta)];
    const [p1x, p1y] = toScreen(...P1);
    elems += `<line x1="${o1x}" y1="${o1y}" x2="${p1x}" y2="${p1y}" stroke="#378ADD" stroke-width="4" stroke-linecap="round"/>`;
    elems += `<line x1="${p1x}" y1="${p1y}" x2="${p2x}" y2="${p2y}" stroke="#1D9E75" stroke-width="4" stroke-linecap="round"/>`;
    elems += `<circle cx="${p1x}" cy="${p1y}" r="5" fill="#378ADD"/>`;
    thetaOut.textContent = (theta*180/Math.PI).toFixed(1) + '°';
  }

  elems += `<circle cx="${p2x}" cy="${p2y}" r="5" fill="#D85A30"/>`;
  elems += `<rect x="${o1x-5}" y="${o1y-5}" width="10" height="10" fill="#333"/>`;
  elems += `<rect x="${o2x-5}" y="${o2y-5}" width="10" height="10" fill="#333"/>`;
  elems += `<text x="${o1x+8}" y="${o1y-8}" font-size="12" fill="#555">O1</text>`;
  elems += `<text x="${o2x+8}" y="${o2y-8}" font-size="12" fill="#555">O2</text>`;

  svg.innerHTML = elems;
}

ids.forEach(id => inputs[id].addEventListener('input', draw));
phiInput.addEventListener('input', draw);
ramaInput.addEventListener('change', draw);
draw();
</script>
</body>
</html>
